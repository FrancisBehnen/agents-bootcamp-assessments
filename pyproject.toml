[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-bootcamp"
version = "0.1.0"
description = "Harness and assignments for the Agents Bootcamp (LangGraph + LangSmith)"
requires-python = ">=3.10"
dependencies = [
    # The core framework family. See README.md for what each one does.
    "langchain>=1.0",        # high-level building blocks (create_agent, chat models, tools)
    "langgraph>=1.0",        # graphs: nodes, edges, state, used for workflows AND agents
    "langchain-openai>=1.0", # ChatOpenAI, which we point at the AI Service Router
    "langsmith>=0.3",        # tracing & observability (you know this from the Evaluation day!)
    # Small utilities used by the harness tools.
    "python-dotenv>=1.0",    # loads your .env file with API keys
    "requests>=2.31",        # for the fetch_webpage tool
    "beautifulsoup4>=4.12",  # turns HTML pages into readable text
]

[tool.setuptools]
# Only the shared `harness` package is installed. The day-1/2/3 assignment
# folders are NOT a package; you run those files directly.
packages = ["harness", "harness.tools"]
